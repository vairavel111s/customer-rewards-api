server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: customer-rewards-api

  datasource:
    url: jdbc:h2:mem:rewardsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Business rules for the rewards program. Externalised so the thresholds can be
# tuned per environment without a code change.
rewards:
  lower-threshold: 50
  upper-threshold: 100
  lower-tier-points-per-dollar: 1
  upper-tier-points-per-dollar: 2
  # Number of calendar months used when the caller does not supply a date range.
  default-period-months: 3
  # Upper bound on a caller supplied range, guards against unbounded queries.
  max-period-months: 24
  # Artificial latency used by the async endpoint to imitate a slow downstream call.
  async-simulated-latency-ms: 750

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.retailer.rewards: DEBUG
    org.hibernate.SQL: WARN
